name: Build Android APK
run-name: Build Android APK (${{ github.ref_name }})

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe APK yang ingin dibuat'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

jobs:
  build:
    name: Assemble & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore Keystore & Environment Secrets
        run: |
          echo "Memeriksa dan memulihkan debug.keystore..."
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore berhasil dipulihkan dari base64."
          fi
          
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
            echo ".env disiapkan untuk build."
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-apks/MoviLish-v1.0-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-apks/MoviLish-v1.0-release.apk
          fi
          ls -lh build-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoviLish-APK
          path: build-apks/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
